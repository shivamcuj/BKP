                });

                card.innerHTML = `
                    <h3 class="text-lg font-semibold mb-4 text-gray-800 dark:text-gray-100"><span class="text-primary dark:text-indigo-400">Q${index + 1}.</span> ${mcq.q}</h3>
                    <div class="options-container" id="mcq-opts-${index}">
                        ${optionsHtml}
                    </div>
                    <button onclick="toggleExp('mcq-exp-${index}')" class="mt-4 text-sm font-semibold text-primary dark:text-indigo-400 hover:underline flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Show Explanation
                    </button>
                    <div id="mcq-exp-${index}" class="explanation-content mt-4 p-4 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-800 dark:text-indigo-200 rounded-lg text-sm border border-indigo-100 dark:border-indigo-800">
                        <strong>Explanation:</strong> ${mcq.exp}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderShorts() {
            const container = document.getElementById('short-container');
            shortData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm border border-gray-100 dark:border-gray-700 transition-colors duration-300 flex flex-col h-full";
                
                card.innerHTML = `
                    <h3 class="text-md font-semibold mb-4 text-gray-800 dark:text-gray-100 flex-grow"><span class="text-emerald-500">Q${index + 1}.</span> ${item.q}</h3>
                    <button onclick="toggleExp('short-exp-${index}')" class="mt-auto text-sm font-semibold text-emerald-600 dark:text-emerald-400 hover:underline w-max flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        Show Answer
                    </button>
                    <div id="short-exp-${index}" class="explanation-content mt-4 p-4 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-800 dark:text-emerald-200 rounded-lg text-sm border border-emerald-100 dark:border-emerald-800">
                        ${item.exp}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderEssays() {
            const container = document.getElementById('essay-container');
            essayData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "bg-white dark:bg-gray-800 rounded-xl p-6 shadow-sm border border-gray-100 dark:border-gray-700 transition-colors duration-300";
                
                card.innerHTML = `
                    <h3 class="text-lg font-semibold mb-4 text-gray-800 dark:text-gray-100 leading-relaxed"><span class="text-purple-500">Q${index + 1}.</span> ${item.q}</h3>
                    <button onclick="toggleExp('essay-exp-${index}')" class="text-sm font-semibold text-purple-600 dark:text-purple-400 hover:underline flex items-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        Show Detailed Answer
                    </button>
                    <div id="essay-exp-${index}" class="explanation-content mt-4 p-5 bg-purple-50 dark:bg-purple-900/30 text-purple-900 dark:text-purple-100 rounded-lg text-md leading-relaxed border border-purple-100 dark:border-purple-800">
                        ${item.exp}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Interaction Logic
        function checkAnswer(btn, qIndex, selectedIndex, correctIndex) {
            const container = document.getElementById(`mcq-opts-${qIndex}`);
            const buttons = container.querySelectorAll('button');
            
            // Disable all buttons in this question
            buttons.forEach(b => {
                b.disabled = true;
                b.classList.remove('hover:bg-gray-50', 'dark:hover:bg-gray-700', 'cursor-pointer');
                b.classList.add('cursor-not-allowed', 'opacity-70');
            });

            if (selectedIndex === correctIndex) {
                // Correct answer selected
                btn.classList.add('correct-ans', 'opacity-100');
            } else {
                // Wrong answer selected
                btn.classList.add('wrong-ans', 'opacity-100');
                // Highlight correct answer
                buttons[correctIndex].classList.add('correct-ans', 'opacity-100');
            }

            // Automatically expand explanation after answering
            const expDiv = document.getElementById(`mcq-exp-${qIndex}`);
            if (!expDiv.classList.contains('show')) {
                expDiv.classList.add('show');
            }
        }

        function toggleExp(id) {
            const el = document.getElementById(id);
            if (el.classList.contains('show')) {
                el.classList.remove('show');
            } else {
                el.classList.add('show');
            }
        }

        function scrollToSection(id) {
            document.getElementById(id).scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Dark Mode Logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        // Check user preference on load
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            lightIcon.classList.remove('hidden');
        } else {
            darkIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', function() {
            darkIcon.classList.toggle('hidden');
            lightIcon.classList.toggle('hidden');

            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
        });

        // Initialize App
        window.onload = () => {
            renderMCQs();
            renderShorts();
            renderEssays();
        };
    </script>
</body>
</html>
