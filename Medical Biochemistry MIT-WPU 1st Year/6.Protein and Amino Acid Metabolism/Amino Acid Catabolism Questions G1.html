<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amino Acid Catabolism | Study Guide</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->

    <!-- Tailwind Config for Dark Mode -->

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],

                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',

                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .glass-header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }
        
        html.dark .glass-header {
            background: rgba(15, 23, 42, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .option-btn {
            transition: all 0.2s ease-in-out;
        }
        
        /* Smooth reveal for explanations */

            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out;

</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-200 min-h-screen flex flex-col">

    <!-- Sticky Header -->
    <header class="sticky top-0 z-50 glass-header">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-primary-100 dark:bg-primary-900 p-2 rounded-xl text-primary-600 dark:text-primary-100">
                    <i data-lucide="book-open" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl tracking-tight text-slate-900 dark:text-white">BioChem Quiz</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Amino Acid Catabolism</p>
                </div>
            </div>
            
            <button onclick="toggleDarkMode()" class="p-2.5 rounded-full bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 transition-colors" aria-label="Toggle Dark Mode">
                <i data-lucide="moon" class="w-5 h-5 dark:hidden text-slate-600"></i>
                <i data-lucide="sun" class="w-5 h-5 hidden dark:block text-yellow-400"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 py-10 w-full space-y-16">
        
        <!-- Welcome Section -->
        <div class="text-center space-y-4 max-w-2xl mx-auto mb-12">
            <span class="inline-block py-1 px-3 rounded-full bg-primary-100 text-primary-700 dark:bg-primary-900/50 dark:text-primary-300 text-sm font-semibold mb-2">Interactive Revision Guide</span>
            <h2 class="text-3xl sm:text-4xl font-bold text-slate-900 dark:text-white">Master Your Syllabus</h2>
            <p class="text-slate-600 dark:text-slate-400 leading-relaxed">Test your knowledge with these 20 MCQs, 10 Short Answer Questions, and 10 Essay Questions. You've got this!</p>
        </div>

        <!-- Section 1: MCQs -->
        <section>
            <div class="flex items-center gap-3 mb-8 border-b border-slate-200 dark:border-slate-700 pb-4">
                <i data-lucide="check-square" class="w-7 h-7 text-primary-500"></i>
                <h3 class="text-2xl font-bold text-slate-900 dark:text-white">Multiple Choice Questions</h3>
            </div>
            <div id="mcq-container" class="grid sm:grid-cols-2 gap-6">
                <!-- MCQs injected via JS -->
            </div>
        </section>

        <!-- Section 2: Short Answers -->
        <section>
            <div class="flex items-center gap-3 mb-8 border-b border-slate-200 dark:border-slate-700 pb-4">
                <i data-lucide="pen-tool" class="w-7 h-7 text-green-500"></i>
                <h3 class="text-2xl font-bold text-slate-900 dark:text-white">Short Answer Questions</h3>
            </div>
            <div id="saq-container" class="space-y-6">
                <!-- SAQs injected via JS -->
            </div>
        </section>

        <!-- Section 3: Essay Questions -->
        <section>
            <div class="flex items-center gap-3 mb-8 border-b border-slate-200 dark:border-slate-700 pb-4">
                <i data-lucide="align-left" class="w-7 h-7 text-purple-500"></i>
                <h3 class="text-2xl font-bold text-slate-900 dark:text-white">Essay Questions</h3>
            </div>
            <div id="essay-container" class="space-y-6">
                <!-- Essays injected via JS -->
            </div>
        </section>

    </main>

    <!-- Footer Section -->
    <footer class="mt-auto bg-white dark:bg-slate-950 border-t border-slate-200 dark:border-slate-800 py-8">
        <div class="max-w-5xl mx-auto px-4 flex flex-col items-center justify-center space-y-4">
            <div class="flex items-center gap-2 text-lg font-medium text-slate-800 dark:text-slate-200">
                Designed For My Bestie 
                <i data-lucide="heart" class="w-5 h-5 text-red-500 fill-red-500 animate-pulse"></i>
            </div>
            
            <a href="https://instagram.com/shivamcuj" target="_blank" class="flex items-center gap-2 px-4 py-2 rounded-full bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors group">
                <i data-lucide="instagram" class="w-5 h-5 group-hover:text-pink-500 transition-colors"></i>
                <span class="font-medium tracking-wide">@shivamcuj</span>
            </a>
        </div>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // --- Data ---
        const mcqData = [
            { q: "What percentage of amino acids formed from protein degradation are catabolized to generate energy in an adult human?", options: ["10%", "20%", "50%", "80%"], ans: 1 },
            { q: "What happens to excess amino acids or proteins consumed beyond the body's requirements?", options: ["They are stored as proteins in the liver.", "They are excreted unchanged in the urine.", "They are used for energy production.", "They are converted directly to vitamins."], ans: 2 },
            { q: "Under normal conditions, what percentage of total body energy do amino acids supply?", options: ["1-2%", "5-10%", "20-30%", "40-50%"], ans: 1 },
            { q: "Which of the following conditions does NOT increase amino acid catabolism?", options: ["Starvation", "Diabetes", "High protein diet", "High carbohydrate diet"], ans: 3 },
            { q: "What is the primary action in the first stage of amino acid catabolism?", options: ["Oxidation of the carbon skeleton", "Removal of the amino group as ammonia", "Formation of ketone bodies", "Conversion to glucose"], ans: 1 },
            { q: "In the human body, toxic ammonia formed during amino acid catabolism is primarily converted into what substance for excretion?", options: ["Uric acid", "Creatinine", "Urea", "Nitric oxide"], ans: 2 },
            { q: "During the second stage of catabolism, carbon skeletons of amino acids are primarily converted into:", options: ["Ammonia and Urea", "TCA cycle intermediates and Acetyl-CoA", "Purines and Pyrimidines", "Glutathione"], ans: 1 },
            { q: "Which enzyme is responsible for the removal of the amino group by transferring it to an acceptor?", options: ["Transaminase", "Glutamate dehydrogenase", "Decarboxylase", "Oxidase"], ans: 0 },
            { q: "During transamination, what is the most common acceptor for the α-amino group?", options: ["Pyruvate", "Oxaloacetate", "α-ketoglutarate", "Malate"], ans: 2 },
            { q: "What is the essential prosthetic group/cofactor for transaminase enzymes?", options: ["NAD+", "FAD", "Pyridoxal phosphate (PLP)", "ATP"], ans: 2 },
            { q: "Which amino acid serves as the primary 'collecting point' for amino groups from other amino acids?", options: ["Aspartate", "Glutamate", "Alanine", "Glycine"], ans: 1 },
            { q: "Glutamate dehydrogenase catalyzes the oxidative deamination of glutamate to yield:", options: ["Oxaloacetate and ammonia", "Pyruvate and water", "α-ketoglutarate and ammonia", "Succinate and CO2"], ans: 2 },
            { q: "Which of the following act as allosteric inhibitors of Glutamate dehydrogenase?", options: ["ADP and GDP", "ATP and GTP", "NAD+ and NADP+", "FAD and FMN"], ans: 1 },
            { q: "D-amino acid oxidase is dependent on which of the following cofactors?", options: ["FMN", "NAD+", "FAD", "PLP"], ans: 2 },
            { q: "Which specific amino acid can be deaminated by D-amino acid oxidase?", options: ["Serine", "Cysteine", "Threonine", "Glycine"], ans: 3 },
            { q: "L-amino acid oxidase is dependent on which cofactor?", options: ["FMN", "FAD", "PLP", "NADP+"], ans: 0 },
            { q: "Non-oxidative deamination of Serine by Serine dehydratase produces ammonia, water, and which other compound?", options: ["Lactate", "Acetyl-CoA", "Pyruvate", "Citrate"], ans: 2 },
            { q: "Which compound is unique to the non-oxidative deamination of Cysteine by Cysteine desulfhydrase?", options: ["H2O", "H2S (Hydrogen sulfide)", "CO2", "O2"], ans: 1 },
            { q: "The decarboxylation of amino acids results in the formation of physiologically significant compounds known as:", options: ["Keto acids", "Biogenic amines", "Purines", "Imino acids"], ans: 1 },
            { q: "Histidine is transformed into which biogenic amine via the action of histidine decarboxylase?", options: ["Tryptamine", "Tyramine", "Histamine", "Serotonin"], ans: 2 }
        ];

        const saqData = [
            { q: "What is the fate of the 80% of amino acids formed from protein degradation?", a: "The remaining 80% of amino acids from protein degradation are recycled and used for protein biosynthesis." },
            { q: "Name three physiological or dietary conditions that increase the rate of amino acid catabolism.", a: "Amino acid catabolism is increased during starvation, uncontrolled diabetes, and when consuming a high-protein diet." },
            { q: "Why must excess consumed proteins be used for energy rather than stored?", a: "Unlike carbohydrates (stored as glycogen) and fats (stored as triglycerides), amino acids cannot be stored in the body. Any excess is immediately catabolized for energy production." },
            { q: "Briefly describe the first stage of amino acid catabolism.", a: "The first stage is the removal of the α-amino group from the amino acid as ammonia. Because ammonia is toxic, it is subsequently converted to urea and excreted in the urine." },
            { q: "What role does α-ketoglutarate play in transamination?", a: "α-ketoglutarate acts as the primary acceptor of the α-amino group transferred from an amino acid. Upon accepting the amino group, it becomes the amino acid glutamate." },
            { q: "What is the significance of the enzyme glutamate dehydrogenase?", a: "It catalyzes the oxidative deamination of glutamate, releasing the collected amino groups as free ammonia and regenerating α-ketoglutarate. This is the primary pathway for net ammonia production." },
            { q: "How do energy levels (ATP/ADP) regulate glutamate dehydrogenase?", a: "High energy levels (ATP and GTP) act as allosteric inhibitors, slowing down the breakdown of glutamate. Conversely, low energy signals (ADP and GDP) act as allosteric activators to stimulate energy production." },
            { q: "What are the intermediate and final products of L-amino acid oxidase activity?", a: "The amino acid is first oxidized to an imino acid (reducing FMN to FMNH2). The imino acid then undergoes hydrolytic loss of ammonia to produce an α-keto acid." },
            { q: "What are the end products of the non-oxidative deamination of serine?", a: "Serine is converted by serine dehydratase into Pyruvate, Ammonia (NH3), and Water (H2O)." },
            { q: "Define decarboxylation of amino acids and mention the required cofactor.", a: "Decarboxylation is the removal of carbon dioxide (CO2) from the carboxyl group of an amino acid to form a biogenic amine. It requires pyridoxal phosphate (PLP) as a coenzyme." }
        ];

        const essayData = [
            { q: "Provide an overview of amino acid catabolism, including its contribution to total body energy and the alternative uses of amino acids inside the cell.", a: "Normally, amino acids supply about 5-10% of total body energy. Only 20% of amino acids from protein degradation are used for energy, while 80% are recycled for protein biosynthesis. Since amino acids cannot be stored, excess dietary protein is entirely catabolized. Besides energy, intracellular amino acids serve as crucial precursors for synthesizing specialized compounds like creatine, hormones, glutathione, purines, and pyrimidines." },
            { q: "Describe in detail the two main stages of amino acid degradation.", a: "The degradation of amino acids occurs in two universal stages. <strong>Stage 1:</strong> The α-amino group is removed, forming toxic ammonia ($NH_3$). To prevent toxicity, the body rapidly converts this ammonia into urea in the liver, which is then excreted by the kidneys via urine. <strong>Stage 2:</strong> The remaining structure, called the carbon skeleton (or α-keto acid), undergoes further transformation. These carbon skeletons are converted into intermediates of the TCA cycle or acetyl-CoA. They are ultimately oxidized in the TCA cycle for ATP generation, or diverted for the synthesis of glucose (gluconeogenesis) or ketone bodies (ketogenesis)." },
            { q: "Explain the process of transamination. Include the enzymes involved, the required cofactor, and the significance of glutamate.", a: "Transamination is the first step in the catabolism of most amino acids. It involves the transfer of an α-amino group from an amino acid to an α-keto acid acceptor (most commonly α-ketoglutarate). This reaction is catalyzed by enzymes called transaminases (or aminotransferases), which are present in the mitochondria and cytosol. These enzymes require Pyridoxal Phosphate (PLP) as a prosthetic group. By transferring amino groups to α-ketoglutarate, transamination effectively funnels or 'collects' amino groups from various amino acids into a single compound: Glutamate. Glutamate thus serves as the central collection point before oxidative deamination." },
            { q: "Discuss oxidative deamination with a specific focus on the role and allosteric regulation of Glutamate Dehydrogenase.", a: "Oxidative deamination is the process where the amino groups collected in glutamate are liberated as free ammonia. The enzyme Glutamate Dehydrogenase, located in the mitochondria and cytosol of the liver, catalyzes the oxidation of glutamate back into α-ketoglutarate and ammonia, utilizing NAD+ or NADP+ as a coenzyme. This enzyme is heavily regulated by the energy state of the cell. It is an allosteric enzyme: ATP and GTP (high energy signals) act as allosteric inhibitors, suppressing amino acid breakdown when energy is abundant. Conversely, ADP and GDP (low energy signals) act as allosteric activators, promoting catabolism to generate ATP." },
            { q: "Compare and contrast D-amino acid oxidase and L-amino acid oxidase regarding their cofactors, substrates, and clinical significance.", a: "Both enzymes catalyze NAD+-independent oxidative deamination, first converting amino acids to imino acids, followed by hydrolysis to an α-keto acid and ammonia. <br><br><strong>D-amino acid oxidase:</strong> Found in the liver and kidney. It uses FAD as a cofactor. While it cannot deaminate many naturally occurring L-amino acids, it specifically acts on D-amino acids and is notable for its ability to deaminate Glycine.<br><br><strong>L-amino acid oxidase:</strong> Also present in liver and kidney. It utilizes FMN as its cofactor. It acts on L-amino acids but cannot deaminate glycine or dicarboxylic amino acids. Its overall activity in human tissues is relatively low, making its overall contribution to systemic ammonia production minor compared to glutamate dehydrogenase." },
            { q: "Detail the mechanisms of non-oxidative deamination, citing specific enzymes, their substrates, and the end products formed.", a: "Non-oxidative deamination involves the direct removal of an amino group as ammonia without an oxidation-reduction reaction. It is catalyzed by specific dehydratases and desulfhydrases requiring PLP. <br><br>1. <strong>Serine dehydratase:</strong> Dehydrates Serine to form dehydroalanine, which spontaneously hydrolyzes to yield Pyruvate, Ammonia, and Water.<br>2. <strong>Cysteine desulfhydrase:</strong> Found primarily in bacteria (not animal tissue). It removes sulfur (desulfuration) from Cysteine to form dehydroalanine, which then yields Pyruvate, Ammonia, and Hydrogen Sulfide ($H_2S$).<br>3. <strong>Threonine dehydratase:</strong> Acts similarly on threonine to yield α-ketobutyrate and ammonia." },
            { q: "Describe the process of amino acid decarboxylation. Discuss its biological significance and provide three examples.", a: "Decarboxylation is the enzymatic removal of a carboxyl group ($CO_2$) from an amino acid. The reaction is catalyzed by specific amino acid decarboxylases and universally requires Pyridoxal Phosphate (PLP) as a coenzyme. This process is biologically critical because it converts amino acids into 'biogenic amines'—molecules that serve as powerful neurotransmitters, hormones, or regulators in the body. <br><br><strong>Examples:</strong><br>1. <strong>Histidine</strong> is decarboxylated by histidine decarboxylase to form <strong>Histamine</strong> (mediates allergic and inflammatory responses).<br>2. <strong>Tryptophan</strong> is converted to <strong>Tryptamine</strong>.<br>3. <strong>Tyrosine</strong> is converted to <strong>Tyramine</strong>." },
            { q: "Trace the ultimate metabolic fates of the carbon skeletons remaining after amino acid deamination.", a: "Once the toxic α-amino group is removed via transamination/deamination, the remaining structure is an α-keto acid, commonly referred to as the 'carbon skeleton.' These carbon skeletons are heavily utilized for cellular energy. They are metabolized into one of several major metabolic intermediates, primarily Acetyl-CoA or various intermediates of the Tricarboxylic Acid (TCA) cycle (like α-ketoglutarate, succinyl-CoA, fumarate, or oxaloacetate). Depending on the body's current physiological needs, these intermediates are either: 1) Fully oxidized in the TCA cycle to produce $CO_2$, $H_2O$, and ATP, 2) Diverted to synthesize glucose via gluconeogenesis (glucogenic amino acids), or 3) Converted into ketone bodies or fatty acids (ketogenic amino acids)." },
            { q: "Summarize the overarching role of Pyridoxal Phosphate (PLP) across the various reactions of amino acid catabolism.", a: "Pyridoxal Phosphate (PLP), the active form of Vitamin B6, is an absolutely essential cofactor for numerous key enzymes involved in amino acid catabolism. Its primary roles include:<br><br>1. <strong>Transamination:</strong> It acts as the prosthetic group for all transaminases (aminotransferases), facilitating the transfer of the α-amino group to an α-keto acid.<br>2. <strong>Non-oxidative Deamination:</strong> It is required by enzymes like serine dehydratase and cysteine desulfhydrase to directly strip ammonia from specific amino acids.<br>3. <strong>Decarboxylation:</strong> It is universally required by amino acid decarboxylases to remove $CO_2$ and generate physiologically active biogenic amines (like histamine). Without PLP, amino acid metabolism would severely halt." },
            { q: "How does the body maintain a normal balance of amino acids, and why does an excess dietary intake lead to increased catabolism rather than storage?", a: "The body maintains amino acid balance through a continuous cycle of protein turnover (synthesis and degradation). Under normal conditions, about 80% of amino acids liberated from breakdown are successfully recycled to build new body proteins, enzymes, and plasma proteins. The diet only needs to replenish the ~20% permanently lost to energy and synthesis of special compounds (hormones, purines). However, the human body lacks a physiological mechanism to store excess amino acids (unlike glycogen for carbs or adipose tissue for fats). Therefore, if a person consumes a high-protein diet exceeding biosynthetic needs, the excess amino acids are obligatorily catabolized—their amino groups are converted to urea, and their carbon skeletons are burned for energy or converted into fat/glycogen reserves." }
        ];

        // --- Render Functions ---
        function renderMCQs() {
            const container = document.getElementById('mcq-container');
            let html = '';
            mcqData.forEach((item, qIndex) => {
                html += `
                <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700 h-full flex flex-col">
                    <p class="font-semibold text-slate-800 dark:text-slate-200 mb-4">${qIndex + 1}. ${item.q}</p>
                    <div class="space-y-3 mt-auto" id="mcq-opts-${qIndex}">
                        ${item.options.map((opt, oIndex) => `
                            <button onclick="checkMCQ(${qIndex}, ${oIndex})" class="option-btn w-full text-left p-3 rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-700/50 hover:bg-primary-50 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 flex items-center">
                                <span class="flex-grow">${opt}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function renderQA(data, containerId, prefix) {
            const container = document.getElementById(containerId);
            let html = '';
            data.forEach((item, index) => {
                html += `
                <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700">
                    <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4">
                        <p class="font-semibold text-slate-800 dark:text-slate-200 flex-grow text-lg">
                            <span class="text-primary-500 mr-2">Q${index + 1}.</span>${item.q}
                        </p>
                        <button id="${prefix}-btn-${index}" onclick="toggleExp('${prefix}', ${index})" class="flex-shrink-0 flex items-center justify-center gap-1 px-4 py-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-lg text-sm font-medium transition-colors">
                            Show Answer <i data-lucide="chevron-down" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <div id="${prefix}-exp-${index}" class="explanation-content hidden mt-4 pt-4 border-t border-slate-100 dark:border-slate-700">
                        <div class="flex gap-3">
                            <i data-lucide="info" class="w-5 h-5 text-primary-500 flex-shrink-0 mt-0.5"></i>
                            <p class="text-slate-600 dark:text-slate-400 leading-relaxed">${item.a}</p>
                        </div>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        // --- Interaction Logic ---
        function checkMCQ(qIndex, selectedOptIndex) {
            const question = mcqData[qIndex];
            const container = document.getElementById(`mcq-opts-${qIndex}`);
            const buttons = container.querySelectorAll('button');

            if (container.dataset.answered === "true") return;
            container.dataset.answered = "true";

            buttons.forEach((btn, index) => {
                btn.classList.remove('hover:bg-primary-50', 'dark:hover:bg-slate-700');
                btn.disabled = true;
                btn.style.cursor = 'default';

                if (index === question.ans) {
                    // This is the right answer
                    btn.classList.add('bg-green-50', 'border-green-500', 'text-green-800', 'dark:bg-green-900/30', 'dark:text-green-400', 'dark:border-green-500');
                    btn.innerHTML += '<i data-lucide="check-circle-2" class="w-5 h-5 ml-auto text-green-500"></i>';
                } else if (index === selectedOptIndex) {
                    // This is the wrong answer the user clicked
                    btn.classList.add('bg-red-50', 'border-red-500', 'text-red-800', 'dark:bg-red-900/30', 'dark:text-red-400', 'dark:border-red-500');
                    btn.innerHTML += '<i data-lucide="x-circle" class="w-5 h-5 ml-auto text-red-500"></i>';
                } else {
                    // Unselected wrong answers
                    btn.classList.add('opacity-50');
                }
            });
            lucide.createIcons();
        }

        function toggleExp(prefix, index) {
            const content = document.getElementById(`${prefix}-exp-${index}`);
            const btn = document.getElementById(`${prefix}-btn-${index}`);
            
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                btn.innerHTML = 'Hide Answer <i data-lucide="chevron-up" class="w-4 h-4"></i>';
            } else {
                content.classList.add('hidden');
                btn.innerHTML = 'Show Answer <i data-lucide="chevron-down" class="w-4 h-4"></i>';
            }
            lucide.createIcons();
        }

        // --- Theme Logic ---
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            renderMCQs();
            renderQA(saqData, 'saq-container', 'saq');
            renderQA(essayData, 'essay-container', 'essay');
            lucide.createIcons();
        });
    </script>
</body>
</html>
