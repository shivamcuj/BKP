<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electron Transport Chain - Interactive Study Guide</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        primary: '#6366f1',
                        darkBg: '#0f172a',
                        darkCard: '#1e293b',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            transition: background-color 0.3s, color 0.3s;
        }
        .mcq-option {
            transition: all 0.2s ease-in-out;
        }
        .mcq-option.disabled {
            pointer-events: none;
        }
        .correct-answer {
            background-color: #22c55e !important;
            color: white !important;
            border-color: #22c55e !important;
        }
        .wrong-answer {
            background-color: #ef4444 !important;
            color: white !important;
            border-color: #ef4444 !important;
        }
        .explanation-content {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        .explanation-content.show {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-darkBg dark:text-gray-200 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white/80 dark:bg-darkCard/80 backdrop-blur-md shadow-sm border-b border-gray-200 dark:border-gray-700">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary">
                    <i class="fa-solid fa-bolt text-xl"></i>
                </div>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-purple-500">ETC Masterclass</h1>
            </div>
            <button id="themeToggle" class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-gray-100 dark:hover:bg-gray-700 transition text-gray-600 dark:text-gray-300">
                <i class="fa-solid fa-moon text-xl dark:hidden"></i>
                <i class="fa-solid fa-sun text-xl hidden dark:block"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full space-y-16">

        <!-- Introduction -->
        <div class="text-center space-y-4">
            <h2 class="text-3xl md:text-4xl font-bold dark:text-white">Electron Transport Chain Study Guide</h2>
            <p class="text-gray-600 dark:text-gray-400 max-w-2xl mx-auto">Test your knowledge with multiple-choice questions, short answers, and detailed essays. Click options to reveal answers instantly.</p>
        </div>

        <!-- Section: MCQs -->
        <section>
            <div class="flex items-center gap-3 mb-8 border-b pb-4 dark:border-gray-700">
                <i class="fa-solid fa-list-check text-2xl text-primary"></i>
                <h2 class="text-2xl font-semibold dark:text-white">Multiple Choice Questions</h2>
            </div>
            <div id="mcq-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- MCQs will be generated here by JS -->
            </div>
        </section>

        <!-- Section: Short Answers -->
        <section>
            <div class="flex items-center gap-3 mb-8 border-b pb-4 dark:border-gray-700">
                <i class="fa-solid fa-pen-clip text-2xl text-green-500"></i>
                <h2 class="text-2xl font-semibold dark:text-white">Short Answer Questions</h2>
            </div>
            <div id="saq-container" class="space-y-6">
                <!-- Short Answers generated by JS -->
            </div>
        </section>

        <!-- Section: Essays -->
        <section>
            <div class="flex items-center gap-3 mb-8 border-b pb-4 dark:border-gray-700">
                <i class="fa-solid fa-book-open text-2xl text-purple-500"></i>
                <h2 class="text-2xl font-semibold dark:text-white">Essay Questions</h2>
            </div>
            <div id="essay-container" class="space-y-6">
                <!-- Essays generated by JS -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white dark:bg-darkCard border-t border-gray-200 dark:border-gray-800 mt-12">
        <div class="max-w-5xl mx-auto px-4 py-8 flex flex-col items-center justify-center space-y-3">
            <p class="text-lg font-medium text-gray-800 dark:text-gray-200 flex items-center gap-2">
                Designed For My Bestie <i class="fa-solid fa-heart text-red-500 animate-pulse"></i>
            </p>
            <a href="https://instagram.com/shivamcuj" target="_blank" class="flex items-center gap-2 text-primary hover:text-indigo-400 transition font-semibold text-lg bg-indigo-50 dark:bg-indigo-900/30 px-4 py-2 rounded-full">
                <i class="fa-brands fa-instagram text-xl"></i>
                @shivamcuj
            </a>
        </div>
    </footer>

    <!-- JavaScript Data and Logic -->
    <script>
        // Data for MCQs (20 Questions)
        const mcqData = [
            { q: "Where is the Electron Transport Chain located?", options: ["Outer mitochondrial membrane", "Mitochondrial matrix", "Inner mitochondrial membrane", "Cytosol"], correct: 2 },
            { q: "What is the terminal electron acceptor in the ETC?", options: ["NAD+", "FAD", "Water", "Oxygen (O2)"], correct: 3 },
            { q: "Complex I is also known as:", options: ["NADH-CoQ reductase", "Succinate-CoQ reductase", "CoQ-Cytochrome c reductase", "Cytochrome oxidase"], correct: 0 },
            { q: "Which complex transfers electrons directly from Succinate to Coenzyme Q?", options: ["Complex I", "Complex II", "Complex III", "Complex IV"], correct: 1 },
            { q: "Which of the following is the ONLY non-protein component of the ETC?", options: ["Cytochrome c", "Cytochrome oxidase", "Coenzyme Q (Ubiquinone)", "FMN"], correct: 2 },
            { q: "Which cytochrome is water-soluble and easily diffusible?", options: ["Cytochrome b", "Cytochrome c1", "Cytochrome a", "Cytochrome c"], correct: 3 },
            { q: "Cytochrome oxidase (Complex IV) contains which important metal ion?", options: ["Copper", "Zinc", "Magnesium", "Calcium"], correct: 0 },
            { q: "How many ATP molecules are yielded from the oxidation of one NADH molecule?", options: ["1", "2", "3", "4"], correct: 2 },
            { q: "How many ATP molecules are yielded from the oxidation of one FADH2 molecule?", options: ["1", "2", "3", "4"], correct: 1 },
            { q: "Which of the following is an inhibitor of Complex I?", options: ["Antimycin A", "Cyanide", "Rotenone", "Oligomycin"], correct: 2 },
            { q: "Dimercaprol and Antimycin A inhibit which complex?", options: ["Complex I", "Complex II", "Complex III", "Complex IV"], correct: 2 },
            { q: "Cyanide and Carbon Monoxide completely arrest respiration by blocking:", options: ["Complex I", "Complex II", "Complex III", "Complex IV"], correct: 3 },
            { q: "Oligomycin directly inhibits which of the following?", options: ["F0F1 ATPase", "Complex II", "Coenzyme Q", "Cytochrome c"], correct: 0 },
            { q: "How do uncouplers prevent ATP synthesis?", options: ["They inhibit electron flow", "They destroy the proton (H+) gradient", "They bind tightly to oxygen", "They break down ATP directly"], correct: 1 },
            { q: "Which of the following is a chemical uncoupler?", options: ["2,4-Dinitrophenol (DNP)", "Amobarbital", "Hydrogen Sulfide (H2S)", "Piericidin A"], correct: 0 },
            { q: "Which of the following acts as a physiological uncoupler?", options: ["Valinomycin", "Gramicidin", "Thermogenin", "Dicoumarol"], correct: 2 },
            { q: "The components of the respiratory chain are arranged in order of:", options: ["Decreasing redox potential", "Increasing redox potential", "Decreasing molecular weight", "Increasing water solubility"], correct: 1 },
            { q: "Electrons that enter through FADH2 bypass which ATP synthesizing site?", options: ["Site 1 (Complex I)", "Site 2 (Complex III)", "Site 3 (Complex IV)", "None of the above"], correct: 0 },
            { q: "Valinomycin and Gramicidin are examples of:", options: ["Inhibitors of phosphorylation", "Inhibitors of ETC proper", "Ionophores", "Physiological uncouplers"], correct: 2 },
            { q: "In the ETC, Coenzyme Q receives electrons from FADH2 via which complex?", options: ["Complex I", "Complex II", "Complex III", "Complex IV"], correct: 1 }
        ];

        // Data for Short Answers (10 Questions)
        const saqData = [
            { q: "Define the Electron Transport Chain (ETC).", a: "The ETC, or Respiratory Chain, is the final step in the overall oxidation of foodstuffs. It oxidizes NADH and FADH2 by transferring electrons through a series of oxidation-reduction reactions to Oxygen, converting these reducing equivalents into ATP via oxidative phosphorylation." },
            { q: "Name the four major complexes of the ETC.", a: "1. Complex I (NADH-CoQ reductase)<br>2. Complex II (Succinate-CoQ reductase)<br>3. Complex III (CoQ-Cytochrome c reductase)<br>4. Complex IV (Cytochrome oxidase)." },
            { q: "Why does NADH yield 3 ATPs while FADH2 yields only 2 ATPs?", a: "NADH enters the ETC at Complex I, passing through all three ATP synthesizing sites. FADH2 enters at Complex II, bypassing the first ATP synthesizing site, and thus only passes through two sites." },
            { q: "What is the specific role of Coenzyme Q (Ubiquinone)?", a: "Coenzyme Q acts as a mobile electron carrier. It collects electrons from Complex I (via NADH) and Complex II (via FADH2) and transfers them to Complex III. It is the only non-protein, fat-soluble component of the chain." },
            { q: "List three inhibitors of Complex IV.", a: "Cyanide, Carbon monoxide (CO), and Hydrogen sulfide (H2S). Inhibition here totally arrests respiration because it blocks the final transfer of electrons to oxygen." },
            { q: "How does Oligomycin affect the ETC?", a: "Oligomycin is an inhibitor of oxidative phosphorylation. It completely blocks oxidation and phosphorylation by directly inhibiting the F0F1 ATPase enzyme, preventing the synthesis of ATP from ADP and Pi." },
            { q: "What is the difference between Cytochrome c and the other cytochromes?", a: "Cytochrome c is water-soluble and easily diffusible across the membrane. In contrast, cytochromes b, c1, a, and a3 are lipid-soluble and act as fixed components within the inner mitochondrial membrane." },
            { q: "What is the function of Cytochrome oxidase?", a: "Cytochrome oxidase (Complex IV) passes electrons from Cytochrome c to molecular oxygen. It contains cytochromes a and a3 (which contain copper). It facilitates oxygen accepting electrons and protons to form water." },
            { q: "Define 'Uncouplers' and give two chemical examples.", a: "Uncouplers allow electron transport to continue but prevent the phosphorylation of ADP to ATP by destroying the proton (H+) gradient. Energy is released as heat instead. Examples: 2,4-Dinitrophenol (DNP) and Dicoumarol." },
            { q: "What are Ionophores?", a: "Ionophores are lipid-soluble ion carrier molecules that bind and carry specific cations (other than H+) through the mitochondrial membrane. This abolishes the membrane potential/pH gradient, inhibiting phosphorylation. Examples include valinomycin and gramicidin." }
        ];

        // Data for Essays (10 Questions)
        const essayData = [
            { q: "Describe the structural organization of the components of the Electron Transport Chain.", a: "The ETC is localized in the inner mitochondrial membrane. The electron carriers are organized into four major protein complexes (I, II, III, and IV) embedded in this membrane. <ul><li><strong>Complex I</strong> (NADH-CoQ reductase) contains FMN and Fe-S proteins.</li><li><strong>Complex II</strong> (Succinate-CoQ reductase) contains FAD and Fe-S.</li><li><strong>Complex III</strong> (CoQ-Cytochrome c reductase) contains cytochromes b, c1, and Fe-S.</li><li><strong>Complex IV</strong> (Cytochrome oxidase) contains cytochromes a, a3, and copper.</li></ul>Coenzyme Q is a lipid-soluble quinone that moves freely in the membrane, connecting Complex I/II to III. Cytochrome c is water-soluble, connecting Complex III to IV. Components are arranged in order of increasing redox potential." },
            { q: "Discuss the three sites of ATP synthesis during electron transport.", a: "The transfer of electrons releases energy coupled to ATP formation via F0F1 ATPase. The three sites are: <ol><li><strong>Site 1:</strong> Oxidation of FMNH2 by Coenzyme Q (Complex I to CoQ).</li><li><strong>Site 2:</strong> Oxidation of cytochrome b by cytochrome c1 (Within Complex III).</li><li><strong>Site 3:</strong> Cytochrome oxidase reaction, specifically the oxidation of cytochrome a by cytochrome a3 (Complex IV).</li></ol> Electrons from NADH pass all three sites (3 ATP), while FADH2 bypasses Site 1 (2 ATP)." },
            { q: "Classify the inhibitors of the respiratory chain and provide examples for each class.", a: "Inhibitors are classified into three groups: <ol><li><strong>Inhibitors of the ETC proper:</strong> Block electron flow. Complex I is blocked by Rotenone, Amobarbital, Piericidin A. Complex III is blocked by Antimycin A, Dimercaprol. Complex IV is blocked by Cyanide, CO, H2S.</li><li><strong>Inhibitors of Oxidative Phosphorylation:</strong> Block F0F1 ATPase directly (e.g., Oligomycin).</li><li><strong>Uncouplers:</strong> Destroy the proton gradient, separating electron flow from ATP synthesis (e.g., 2,4-DNP).</li></ol>" },
            { q: "Explain the mechanism of action of uncouplers and differentiate between chemical, physiological, and ionophores.", a: "Uncouplers destroy the essential linkage between electron transport and ATP synthesis by making the inner membrane abnormally permeable to protons (H+). The proton gradient is lost, and energy is released as heat. <br><br><strong>Chemical uncouplers</strong> (e.g., 2,4-DNP, Aspirin) are lipophilic and carry H+ across. <br><strong>Physiological uncouplers</strong> (e.g., Thermogenin, Thyroxine) naturally occur in the body for thermogenesis (heat generation). <br><strong>Ionophores</strong> (e.g., Valinomycin) differ by carrying cations <em>other</em> than H+ (like K+) across the membrane, abolishing the electrical potential required for ATP synthesis." },
            { q: "Detail the step-by-step oxidation-reduction sequence from NADH to Coenzyme Q.", a: "1. NAD+ is reduced to NADH by various dehydrogenases, removing two hydrogen atoms from a metabolite. <br>2. Reduced NADH is oxidized by Complex I (NADH dehydrogenase) which contains FMN. FMN accepts 2 electrons and a proton from NADH, plus a free proton from the medium, forming FMNH2. <br>3. Fe-S proteins in Complex I accept electrons from FMNH2, oxidizing it back to FMN, while releasing 2 protons into the medium. <br>4. Coenzyme Q accepts these two electrons from the Fe-S proteins and two protons from the medium to become reduced to CoQH2." },
            { q: "Explain the role and characteristics of Cytochromes in the Electron Transport Chain.", a: "Cytochromes are hemeproteins involved in the later stages of the ETC, transferring electrons from Coenzyme Q to Oxygen. They can only carry one electron at a time. <br>There are five main cytochromes: b, c1, c, a, and a3. <br>Cytochromes b, c1, a, and a3 are lipid-soluble and fixed in the membrane. Cytochrome c is water-soluble and freely diffusible. Complex IV (Cytochrome a and a3) is unique because it also contains copper and is responsible for the final transfer of electrons to O2 to form water." },
            { q: "Analyze the significance of Redox Potential in the Electron Transport Chain.", a: "Redox potential (E0') dictates the direction of electron flow. Components of the respiratory chain are strictly arranged in order of <em>increasing</em> (more positive) redox potential. Electrons naturally flow from a highly negative redox potential (like NADH/NAD+ at -0.32V) down to highly positive redox potentials (like H2O/O2 at +0.82V). This downhill flow releases energy at specific steps, which is harnessed by the cell to pump protons and ultimately synthesize ATP." },
            { q: "Compare the pathways of NADH and FADH2 in the ETC.", a: "<strong>NADH Pathway:</strong> Enters at Complex I (NADH-CoQ reductase). Electrons flow from Complex I -> CoQ -> Complex III -> Cyt c -> Complex IV -> Oxygen. It passes through three ATP coupling sites, yielding 3 ATPs.<br><br><strong>FADH2 Pathway:</strong> Enters at Complex II (Succinate-CoQ reductase). Electrons flow from Complex II -> CoQ -> Complex III -> Cyt c -> Complex IV -> Oxygen. Because it enters after Complex I, it bypasses the first ATP coupling site, yielding only 2 ATPs." },
            { q: "What is biological oxidative phosphorylation, and how is it linked to biological oxidation?", a: "Biological oxidative phosphorylation is the process by which ATP is formed from ADP and inorganic phosphate (Pi) as a direct result of electron transport. It is 'coupled' to biological oxidation because the energy required to attach the phosphate group to ADP is derived from the oxidation of NADH and FADH2 as their electrons flow through the ETC. The enzyme F0F1 ATPase utilizes the proton gradient generated by this oxidation to drive the mechanical synthesis of ATP." },
            { q: "Discuss the effect of Cyanide poisoning on the Electron Transport Chain.", a: "Cyanide is an extremely potent inhibitor of the ETC proper. It specifically targets and binds tightly to Complex IV (Cytochrome oxidase), specifically to the oxidized form of the iron/copper center in cytochrome a3. This completely blocks the final transfer of electrons to molecular oxygen. Because the electrons have nowhere to go, the entire chain backs up, completely arresting cellular respiration, stopping ATP production, and rapidly causing cell death." }
        ];

        // Theme Toggle Logic
        const themeBtn = document.getElementById('themeToggle');
        const html = document.documentElement;

        themeBtn.addEventListener('click', () => {
            html.classList.toggle('dark');
        });

        // Generate MCQs
        const mcqContainer = document.getElementById('mcq-container');
        mcqData.forEach((mcq, index) => {
            const card = document.createElement('div');
            card.className = "bg-white dark:bg-darkCard p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700";
            
            let optionsHtml = '';
            mcq.options.forEach((opt, oIdx) => {
                optionsHtml += `
                    <button onclick="checkAnswer(this, ${oIdx}, ${mcq.correct})" class="mcq-option w-full text-left p-4 rounded-xl border border-gray-200 dark:border-gray-600 mb-3 hover:bg-gray-50 dark:hover:bg-gray-700 dark:text-gray-300 font-medium text-sm sm:text-base">
                        <span class="inline-block w-6 font-bold text-primary">${String.fromCharCode(65 + oIdx)}.</span> ${opt}
                    </button>
                `;
            });

            card.innerHTML = `
                <h3 class="font-semibold text-lg mb-4 text-gray-800 dark:text-gray-100"><span class="text-primary mr-2">Q${index + 1}.</span>${mcq.q}</h3>
                <div class="options-container flex flex-col">
                    ${optionsHtml}
                </div>
            `;
            mcqContainer.appendChild(card);
        });

        // Check MCQ Answer
        function checkAnswer(btn, selectedIdx, correctIdx) {
            const container = btn.closest('.options-container');
            const allButtons = container.querySelectorAll('button');
            
            // Disable all buttons after click
            allButtons.forEach((b, idx) => {
                b.classList.add('disabled', 'opacity-70');
                if(idx === correctIdx) {
                    b.classList.add('correct-answer');
                    b.innerHTML += ' <i class="fa-solid fa-circle-check float-right mt-1"></i>';
                }
            });

            if(selectedIdx !== correctIdx) {
                btn.classList.add('wrong-answer');
                btn.classList.remove('opacity-70');
                btn.innerHTML += ' <i class="fa-solid fa-circle-xmark float-right mt-1"></i>';
            }
        }

        // Generate Short Answers & Essays
        function generateTextQuestions(data, containerId, badgeColor, icon) {
            const container = document.getElementById(containerId);
            data.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "bg-white dark:bg-darkCard p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700";
                
                card.innerHTML = `
                    <h3 class="font-semibold text-lg text-gray-800 dark:text-gray-100 mb-4 flex items-start">
                        <span class="${badgeColor} text-white text-sm font-bold w-7 h-7 flex items-center justify-center rounded-full mr-3 shrink-0 mt-0.5">${index + 1}</span>
                        ${item.q}
                    </h3>
                    <button onclick="toggleExplanation(this)" class="text-sm font-semibold flex items-center gap-2 px-4 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 transition">
                        <i class="fa-solid ${icon}"></i> Show Explanation
                    </button>
                    <div class="explanation-content mt-4 p-4 rounded-xl bg-indigo-50 dark:bg-indigo-900/20 border border-indigo-100 dark:border-indigo-800 text-gray-700 dark:text-gray-300 leading-relaxed text-sm sm:text-base">
                        ${item.a}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        generateTextQuestions(saqData, 'saq-container', 'bg-green-500', 'fa-lightbulb');
        generateTextQuestions(essayData, 'essay-container', 'bg-purple-500', 'fa-book-open');

        // Toggle Explanation Logic
        function toggleExplanation(btn) {
            const content = btn.nextElementSibling;
            const icon = btn.querySelector('i');
            
            if (content.classList.contains('show')) {
                content.classList.remove('show');
                btn.innerHTML = `<i class="fa-solid ${icon.classList[1]}"></i> Show Explanation`;
            } else {
                content.classList.add('show');
                btn.innerHTML = `<i class="fa-solid fa-eye-slash"></i> Hide Explanation`;
            }
        }
    </script>
</body>
</html>
